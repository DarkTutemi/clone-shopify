<script>
document.addEventListener('DOMContentLoaded', function () {
    const rows = document.querySelectorAll('.vs-earthly-glow-carousel');

    rows.forEach(row => {
        const prevButton = row.closest('.vs-earthly-glow-fluid').querySelector('.glow-carousel-prev');
        const nextButton = row.closest('.vs-earthly-glow-fluid').querySelector('.glow-carousel-next');
        const dotsContainer = row.closest('.vs-earthly-glow-fluid').querySelector('.glow-carousel-dots');
        const items = row.querySelectorAll('.vs-earthly-glow-carousel-item');

        // Set scroll amount to match one slide's width
        const slideWidth = items[0].offsetWidth;

        // Clear existing dots
        dotsContainer.innerHTML = '';

        // Create a dot for each slide
        items.forEach((item, index) => {
            const dot = document.createElement('span');
            dot.classList.add('glow-carousel-dot');
            if (index === 0) dot.classList.add('active');
            dotsContainer.appendChild(dot);

            // Scroll one slide per dot click
            dot.addEventListener('click', () => {
                row.scrollTo({
                    left: index * slideWidth,
                    behavior: 'smooth'
                });
            });
        });

        const dots = dotsContainer.querySelectorAll('.glow-carousel-dot');

        const updateDots = () => {
            const index = Math.round(row.scrollLeft / slideWidth);
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === index);
            });
        };

        const updateButtonStates = () => {
            prevButton.classList.toggle('disabled', row.scrollLeft <= 0);
            nextButton.classList.toggle('disabled', row.scrollLeft + row.clientWidth >= row.scrollWidth);
        };

        updateButtonStates();

        row.addEventListener('scroll', () => {
            updateButtonStates();
            updateDots();
        });

        prevButton.addEventListener('click', () => {
            row.scrollBy({ left: -slideWidth, behavior: 'smooth' });
        });

        nextButton.addEventListener('click', () => {
            row.scrollBy({ left: slideWidth, behavior: 'smooth' });
        });
    });
});



document.querySelectorAll('.vs-earthly-glow-play-button').forEach(function(button) {
    button.addEventListener('click', function() {
        // Find the corresponding iframe and poster for this button
        var iframe = this.closest('.vs-earthly-glow-carousel-item').querySelector('.vs-earthly-glow-iframe');
        var poster = this.closest('.vs-earthly-glow-carousel-item').querySelector('.vs-earthly-glow-video-poster');
        
        // Hide the poster
        poster.style.display = 'none';
        
        // Create a new Vimeo player for this specific iframe
        var player = new Vimeo.Player(iframe);
        player.play();
    });
});

</script>
