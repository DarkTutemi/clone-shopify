(function () {
  document.querySelectorAll('.js-main-product__video').forEach(function (videoWrapper) {
    const video = videoWrapper.querySelector('video');
    const preview = videoWrapper.querySelector('.js-main-product__preview-image');
    const playIcon = videoWrapper.querySelector('.js-main-product__play-icon');

    if (!video) return;

    const isAutoplay = video.dataset.autoplay === 'true';
    const isLoop = video.dataset.loop === 'true';

    function injectSources() {
      if (video.dataset.sources && video.children.length === 0) {
        const sources = video.dataset.sources.split(',');
        const types = video.dataset.types.split(',');
        sources.forEach(function (src, i) {
          const source = document.createElement('source');
          source.src = src.trim();
          source.type = types[i] ? types[i].trim() : '';
          video.appendChild(source);
        });
        video.load();
      }
    }

    if (isAutoplay) {
      injectSources();
      video.muted = true;
      video.loop = true;
      video.play().catch(function () {});
      if (preview) preview.classList.add('is-hidden');
    }

    if (playIcon) {
      playIcon.addEventListener('click', function (e) {
        e.stopPropagation();
        injectSources();
        video.muted = false;
        video.loop = isLoop;
        video.controls = true;
        video.play();

      video.controls = false;
      if (preview) preview.classList.remove('is-hidden');

    });
  });

  document.addEventListener('DOMContentLoaded', function () {
    const mediaElement = document.querySelector(
      '.product-single__wrapper.vs_earthly_product .product-single__media-slider .product-single__media-slide:first-child .product-single__media'
    );
    const badgeText = document.querySelector('.vs-product-badge')?.textContent.trim();
    if (mediaElement) {
      if (badgeText) {
        mediaElement.style.setProperty('--badge-text', `"${badgeText}"`);
      } else {
        mediaElement.classList.add('hidden-after');
      }
    }
  });

  document.addEventListener('DOMContentLoaded', function () {
    const observer = new MutationObserver((mutationsList, observer) => {
      // Select the elements only when they are available
      const ratingLabel = document.querySelector('.loox-rating-label');
      const happyFaces = document.querySelector('.pdp-happy-faces-flex span');

      if (ratingLabel && happyFaces) {
        // Grab the text Loox injects (e.g. "(441)")
        let ratingText = ratingLabel.textContent.trim();

        // Remove parentheses -> "441"
        ratingText = ratingText.replace(/[()]/g, '');

        // Now assign "441" to .pdp-happy-faces-flex a
        happyFaces.textContent = ratingText;

        // Stop observing once the elements are found & replaced
        observer.disconnect();
      }
    });

    // Start observing the body for changes to DOM elements
    observer.observe(document.body, { childList: true, subtree: true });
  });
</script>

<script>
  // Function to update the price in the target element
  function updatePrice() {
    var priceElement = document.querySelector(
      '.product-single__wrapper.vs_earthly_product .product__block.product__price-and-badge .product__price .product__price--regular'
    );
    var saleElement = document.querySelector(
      '.product-single__wrapper.vs_earthly_product .product__block.product__price-and-badge .product__price .product__price--compare'
    );

    if (priceElement) {
      var priceText = priceElement.textContent.trim();

      var targetElement = document.querySelector('.vs-money-cart');
      if (targetElement) {
        targetElement.textContent = priceText;
      }
    }
    if (saleElement) {
      var saleText = saleElement.textContent.trim();

      var saleTargetElement = document.querySelector('.vs-sale-cart');
      if (saleTargetElement) {
        const saleValue = parseFloat(saleText.replace(/[^0-9.]/g, ''));

        if (saleValue === 0) {
          saleTargetElement.textContent = '';
        } else {
          saleTargetElement.textContent = saleText;
        }
      }
    }
  }

  document
    .querySelectorAll(
      '.product-single__wrapper.vs_earthly_product .product__selectors .radio__button .quantity__selector__label'
    )
    .forEach(function (element) {
      element.addEventListener('click', updatePrice);
    });

  var variantSelector = document.querySelector('.product-single__wrapper.vs_earthly_product .product__selectors');
  if (variantSelector) {
    variantSelector.addEventListener('change', updatePrice);
  }

  setTimeout(updatePrice, 2000);
</script>


<script>
  (function () {
    var timer;
    var addedByUs = false;

    document.addEventListener(
      'click',
      function (e) {
        if (!e.target.closest('.kaching-bundles__bar')) return;

        var btn = document.querySelector('.product__submit__add');
        if (!btn) return;

        if (!btn.classList.contains('is-loading')) {
          btn.classList.add('is-loading');
          addedByUs = true;
        }

        clearTimeout(timer);
        timer = setTimeout(function () {
          if (typeof updatePrice === 'function') updatePrice();
          if (addedByUs) {
            btn.classList.remove('is-loading');
            addedByUs = false;
          }
        }, 500);
      },
      true
    );
  })();
</script>
