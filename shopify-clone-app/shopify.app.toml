# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "82d6aaab9e73809cb37b6643302b1255"
name = "Clone-theme"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = false

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,write_customers,read_price_rules,write_price_rules,read_discounts,write_discounts,read_files,write_files,write_inventory,read_inventory,read_locales,write_locales,write_locations,read_locations,read_markets,write_markets,read_markets_home,write_markets_home,read_online_store_navigation,write_online_store_navigation,read_orders,write_orders,read_product_feeds,write_product_feeds,read_product_listings,write_product_listings,read_products,write_products,read_publications,write_publications,read_content,write_content,write_theme_code,read_themes,write_themes,customer_write_customers,customer_read_customers,customer_read_orders,customer_write_orders"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ ]
